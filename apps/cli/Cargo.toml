[package]
name = "wii-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Unified single-binary self-hostable Wii OS BIOS 4.3E, NetPlay, wgpu GUI, and WASM/EXE game packager"

[[bin]]
name = "wii"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wii-menu-core.workspace = true
wii-menu-runtime.workspace = true
wii-os-server = { path = "../server" }
wii-menu-native = { path = "../menu-native" }
image = { path = "../../crates/gecko-image" }
gecko = { path = "../../crates/gecko-core", default-features = false }
