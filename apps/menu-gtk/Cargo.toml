[package]
name = "wii-menu-gtk"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "GTK4 Linux host for the shared Wii OS menu model"

[features]
default = []
gtk-host = ["dep:gtk"]

[[bin]]
name = "wii-menu-gtk"
path = "src/main.rs"
required-features = ["gtk-host"]

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_10"], optional = true }
serde_json.workspace = true
wii-menu-core.workspace = true
wii-menu-runtime.workspace = true
