[package]
name = "wii-os-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Opt-in Wii OS lobby and WebSocket control-plane service"

[lib]
name = "wii_os_server"
path = "src/lib.rs"

[[bin]]
name = "wii-os-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
serde.workspace = true
serde_json.workspace = true
rusqlite = { version = "0.41.1", features = ["bundled"] }
rmcp = { version = "=3.8.0", features = ["transport-streamable-http-server"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync"] }
wii-menu-core.workspace = true
wii-menu-runtime.workspace = true
tower-http = { version = "0.6", features = ["fs"] }
