# ==============================================================================
# Wii OS Production Nginx Configuration
# ==============================================================================
# Targets:
# - Full WebGPU / SharedArrayBuffer isolation (COOP/COEP)
# - HTTP 206 Partial Content Range slicing for multi-gigabyte Wii RVZ/ISO discs (8MB chunks)
# - In-process WebSockets for native NetPlay and presence synchronization (/v1/ws)
# - Fast edge caching of static Wii assets, textures, fonts, and BRSAR audio
# ==============================================================================

# Define cache path for 8MB disc slices and static assets
proxy_cache_path /var/cache/nginx/wii_os_cache
    levels=1:2
    keys_zone=wii_disc_cache:256m
    max_size=20g
    inactive=30d
    use_temp_path=off;

# Upstream Wii OS Server (Axum / Tokio in-process control plane)
upstream wii_os_backend {
    server 127.0.0.1:8780;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name wii.local wii-os.internal localhost;

    # Maximum allowed request size for WAD and save uploads
    client_max_body_size 64M;

    # Gzip compression for JSON metadata, BMG messages, and shader text
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/wasm;

    # --------------------------------------------------------------------------
    # Mandatory Security & WebGPU Isolation Headers (COOP / COEP)
    # Required for SharedArrayBuffer multithreading in Gecko WebGPU runtime
    # --------------------------------------------------------------------------
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # --------------------------------------------------------------------------
    # 1. Disc Streaming with Nginx Slice (8MB Range Caching)
    # Serves Budokai Tenkaichi 3 and Wii discs with sub-second time-to-first-byte
    # --------------------------------------------------------------------------
    location /cdn/shenron/games/ {
        slice 8m;

        proxy_cache wii_disc_cache;
        proxy_cache_key $uri$slice_range;
        proxy_cache_valid 200 206 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;

        # Forward range request to upstream slice
        proxy_set_header Range $slice_range;
        proxy_set_header If-Range $http_if_range;

        proxy_pass http://wii_os_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        # Diagnostic header indicating cache status (HIT, MISS, BYPASS)
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Accept-Ranges bytes always;
    }

    # --------------------------------------------------------------------------
    # 2. NetPlay & Real-Time Presence WebSocket (/v1/ws)
    # Full duplex binary & text synchronization for multiplayer lobby
    # --------------------------------------------------------------------------
    location /v1/ws {
        proxy_pass http://wii_os_backend;
        proxy_http_version 1.1;

        # WebSocket Upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Disable timeouts for persistent NetPlay matches
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --------------------------------------------------------------------------
    # 3. Static Assets, WASM Modules, Shaders, and Sound (Cache Forever)
    # --------------------------------------------------------------------------
    location ~* \.(wasm|brsar|tpl|ash|arc|dol|ttc|brfna|png|jpg|webp)$ {
        proxy_pass http://wii_os_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    # --------------------------------------------------------------------------
    # 4. REST API, MCP Endpoint, and System Control Plane
    # --------------------------------------------------------------------------
    location /v1/ {
        proxy_pass http://wii_os_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /mcp {
        proxy_pass http://wii_os_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --------------------------------------------------------------------------
    # 5. Default Fallback & Shell
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://wii_os_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
}
