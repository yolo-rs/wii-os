# Wii OS 4.3E + CDN Shenron Reverse Proxy (3dland.tech, play.dragonballfr.com, wii.js.org)
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream upstream_wii_os_shenron {
    server 127.0.0.1:8780;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name 3dland.tech www.3dland.tech play.dragonballfr.com game-api.dragonballfr.com wii.js.org;
    client_max_body_size 128m;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://upstream_wii_os_shenron;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic reuseport;
    listen [::]:443 quic reuseport;
    http2 on;
    http3 on;

    server_name 3dland.tech www.3dland.tech play.dragonballfr.com game-api.dragonballfr.com wii.js.org;
    ssl_certificate /etc/letsencrypt/live/3dland.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3dland.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 128m;

    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://upstream_wii_os_shenron;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
    }
}
