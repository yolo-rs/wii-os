[package]
name = "wii-menu-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "WebAssembly bridge for the shared Wii OS menu state core"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json.workspace = true
wasm-bindgen = "0.2"
wii-menu-core.workspace = true
web-sys = { version = "0.3", features = ["Window", "Document", "Event", "EventTarget", "Element", "HtmlElement", "DomRect", "DomTokenList", "CssStyleDeclaration"] }
