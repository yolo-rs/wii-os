[package]
name = "debugger"
version = "0.1.0"
license = "GPL-3.0-only"
edition = "2024"

[features]
scripting-mut-traps = ["gecko/hooks-mut-traps", "scripting/hooks-mut-traps"]
renderdoc-capture = ["backend-wgpu/renderdoc-capture"]

[dependencies]
gecko = { path = "../gecko-core", features = ["hooks", "audio-wav-dump"] }
scripting = { path = "../gecko-scripting" }
image = { path = "../gecko-image", features = ["symbols"] }
dbglib = { path = "../gecko-dbglib" }
backend-wgpu = { path = "../gecko-backend-wgpu" }
crossbeam-channel = "0.5.15"
ctrlc = "3.5.2"
wgpu = "29.0.3"
winit = "0.30.13"
pollster = "0.4.0"
egui = "0.34.2"
egui-wgpu = "0.34.2"
egui-winit = { version = "0.34.2", features = ["wayland", "x11"] }
egui-phosphor = { version = "0.12.0", features = ["fill"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
clap = { version = "4.6.0", features = ["derive"] }



