[package]
name = "wii-menu-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Host runtime adapters, NetPlay coordinator, NAND inspector, and WASM/EXE game packager shared by Wii OS frontends"

[features]
default = []
embedded-dolphin = ["dep:wii-dolphin-ffi", "wii-dolphin-ffi/linked-dolphin"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
wii-menu-core.workspace = true
wii-dolphin-ffi = { workspace = true, optional = true }
